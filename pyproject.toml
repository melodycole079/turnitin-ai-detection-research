[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-text-detection-benchmark"
version = "0.1.0"
description = "Reproducible, independent benchmark for AI-text classification"
requires-python = ">=3.10"
dependencies = ["pandas==2.2.3", "scikit-learn==1.5.2", "pyyaml==6.0.2"]
[project.optional-dependencies]
test = ["pytest==9.1.1"]
[tool.pytest.ini_options]
pythonpath = ["src"]
